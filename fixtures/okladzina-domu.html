        <p id="warn" role="alert"></p>
      </div>

  </div>
</div>

<script>
function shim(root){return new Proxy(document,{get:function(t,k){
  if(k==='getElementById')return function(id){return root.getElementById(id);};
  if(k==='querySelector')return function(s){return root.querySelector(s);};
  if(k==='querySelectorAll')return function(s){return root.querySelectorAll(s);};
  var v=t[k];return typeof v==='function'?v.bind(t):v;}});}
function mount(slug,fn){var h=document.getElementById('host-'+slug),sr=h.attachShadow({mode:'open'});
  sr.appendChild(document.getElementById('tpl-'+slug).content.cloneNode(true));
  try{fn(shim(sr));}catch(e){console.error(slug,e);}}
</script>

<script>
mount('salon',function(document){

(function(){
var DEF={W:548,L:980,ang:40,HL:107,niche:17,dA:140,ZA:415,wB:349,dB:60,cutOn:1,cutH:56,winOn:1,winD:50,PL:499,PW:125,ZO:415,XO:0,o1:0,o2:0,o3:0,o4:0,o5:0,o6:0,o7:0,o8:0,o9:0};
var FIELDS=[
 ['Bryła','W','Szerokość wnętrza',cm()],['Bryła','L','Długość salonu',cm()],['Bryła','ang','Kąt dachu','°'],
 ['Bryła','HL','Wysokość pasa pod skosem (lewa)',cm()],['Bryła','niche','Wnęka na zasłony (prawa)',cm()],
 ['Wycięcia','dA','Wpust: szerokość',cm()],['Wycięcia','ZA','Wpust: długość',cm()],
 ['Wycięcia','wB','Zabudowa: szerokość',cm()],['Wycięcia','dB','Zabudowa: głębokość',cm()],
 ['Wycięcia','cutOn','Wycięcie w ścianie z końca','chk'],['Wycięcia','cutH','Wysokość tego wycięcia',cm()],
 ['Okno','winOn','Okno w ścianie z=0','chk'],['Okno','winD','Odstęp okna od dachu, ściany i podłogi',cm()],
 ['Płyty','PL','Długość płyty',cm()],['Płyty','PW','Szerokość płyty',cm()],
 ['Start montażu','ZO','Start domyślny na dachu (z)',cm()],['Start montażu','XO','Start domyślny na szczytach (x)',cm()]
];
function cm(){return 'cm';}
var LIM={W:[200,1200],L:[200,3000],ang:[10,70],HL:[0,300],niche:[0,100],dA:[10,400],ZA:[10,2900],wB:[1,1200],dB:[10,400],cutH:[0,250],winD:[10,200],PL:[100,1000],PW:[20,300],ZO:[0,3000],XO:[-1000,1000]};
var f=function(v){return Math.round(v);};
var pts=function(a){return a.map(function(q){return q[0].toFixed(1)+','+q[1].toFixed(1);}).join(' ');};
var T=function(x,y,t,c,a){return '<text x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" class="'+(c||'t2')+'" text-anchor="'+(a||'middle')+'">'+t+'</text>';};
var SC=0.62,M=30;

function norm(pin){
  var p={},w=[],k;
  for(k in DEF){var v=Number(pin&&pin[k]);p[k]=isFinite(v)&&pin&&pin[k]!==''&&pin[k]!==null&&pin[k]!==undefined?v:DEF[k];}
  function cl(key,lo,hi,label){if(p[key]<lo){p[key]=lo;w.push(label+': najmniej '+lo);}else if(p[key]>hi){p[key]=hi;w.push(label+': najwięcej '+hi);}}
  for(k in LIM){if(k==='dA'||k==='wB'||k==='ZA'||k==='dB'||k==='winD'||k==='niche')continue;cl(k,LIM[k][0],LIM[k][1],k);}
  for(var oi=1;oi<=9;oi++)cl('o'+oi,-1000,1000,'przesunięcie R'+oi);
  var hw=p.W/2;
  cl('niche',0,Math.min(100,hw-30),'wnęka');
  var XR=hw-p.niche;
  cl('dA',10,XR-10,'wpust: szerokość');
  cl('ZA',10,p.L-30,'wpust: długość');
  cl('wB',hw+1,p.W-p.niche-1,'zabudowa: szerokość (musi sięgać za oś kalenicy)');
  cl('dB',10,Math.max(10,p.L-p.ZA-10),'zabudowa: głębokość');
  cl('winD',10,hw-10,'okno: odstęp');
  p.cutOn=pin&&pin.cutOn===0?0:(pin&&pin.cutOn===false?0:(pin&&pin.cutOn!==undefined?(pin.cutOn?1:0):DEF.cutOn));
  p.winOn=pin&&pin.winOn!==undefined?(pin.winOn?1:0):DEF.winOn;
  return {p:p,w:w};
}

function model(pin){
  var n=norm(pin),p=n.p,A=Math.tan(p.ang*Math.PI/180),C=Math.cos(p.ang*Math.PI/180);
  var hw=p.W/2,XR=hw-p.niche,XA=XR-p.dA,XB=-hw+p.wB,ZB=p.L-p.dB,ZA=p.ZA,L=p.L,RID=p.HL+hw*A,BW=p.PW,ZO=p.ZO,XO=p.XO;
  var y=function(x){return RID-Math.abs(x)*A;};
  var HR=y(XR);
  function cols(z0,z1,ZO){var o=[];for(var k=Math.floor((z0-ZO)/BW+1e-9);ZO+k*BW<z1-1e-9;k++){var s=Math.max(z0,ZO+k*BW),e=Math.min(z1,ZO+(k+1)*BW);if(e-s>1)o.push([s,e]);}return o;}
  function strips(a,b,XO){var o=[],x=a;while(x<b-1e-6){var xe=XO+(Math.floor((x-XO)/BW+1e-9)+1)*BW;if(xe<=x+1e-6)xe+=BW;xe=Math.min(b,xe);if(xe-x>0.5)o.push([x,xe]);x=xe;}return o;}
  var id=0,surfs=[],refs=[],area=0,fields=0;
  var a2=ZO+p.o3,zj=a2+Math.floor((ZB-a2)/BW)*BW,ZJ=(zj>ZA+1&&ZB-zj<10)?zj:ZB;
  function addBoard(title,u,z0,z1,cut,notch,desc,lastTop,anchor){
    var cs=cols(z0,z1,anchor).map(function(c){return {id:++id,a:c[0],b:c[1]};});
    if(!cs.length)return;
    var cand=[z0,z1];cs.forEach(function(c){cand.push(c.a,c.b);});
    var zr=cand.reduce(function(b,c){return Math.abs(c-anchor)<Math.abs(b-anchor)?c:b;},cand[0]);
    var s={anchor:anchor,kind:'board',title:title,u:u,z0:z0,z1:z1,cut:cut,notch:notch,cols:cs,zr:zr,desc:desc,top:lastTop};
    s.ref='R'+(refs.length+1);
    var ur=notch&&zr>notch[0]?notch[1]:0;s.ur=ur;
    surfs.push(s);
    var ar=(z1-z0)*u-(notch?(z1-notch[0])*notch[1]:0);area+=ar;fields+=cs.length;
    refs.push({id:s.ref,name:title,fields:cs[0].id===cs[cs.length-1].id?String(cs[0].id):cs[0].id+'–'+cs[cs.length-1].id,where:lastTop?'górna krawędź ściany, linia łączenia z='+f(zr):'góra deski przy kalenicy, linia łączenia z='+f(zr),coord:lastTop?('x='+f(lastTop.x)+', wys.='+f(lastTop.h)+', z='+f(zr)):('x=0, wys.='+f(RID)+', z='+f(zr))});
  }
  addBoard('Lewa strona: połać + ściana',hw/C+p.HL,0,ZB,hw/C,null,undefined,undefined,ZO+p.o1);
  addBoard('Prawa strona, przy wpuście',XA/C+y(XA),0,ZA,XA/C,null,undefined,undefined,ZO+p.o2);
  addBoard('Prawa strona, ściana x='+f(XR),XR/C+HR,ZA,ZJ,XR/C,null,undefined,undefined,ZO+p.o3);
  addBoard('Prawa strona, przy zabudowie',XR/C+HR,ZJ,L,XR/C,[ZB,XB/C],undefined,undefined,ZO+p.o4);
  addBoard('Ściana wycięcia zabudowy x='+f(XB),y(XB),ZB,L,null,null,'',{x:XB,h:y(XB)},ZO+p.o5);
  // ściany szczytowe
  var walls=[{z:0,x0:-hw,x1:XA,bs:0,title:'ściana z=0 (okno)'},{z:ZA,x0:XA,x1:XR,bs:0,title:'ściana z='+f(ZA)+' (wpust)'},{z:ZB,x0:-hw,x1:XB,bs:0,title:'ściana z='+f(ZB)+' (zabudowa)'},{z:L,x0:XB,x1:XR,bs:p.cutOn?p.cutH:0,title:'ściana z='+f(L)+(p.cutOn?' (od '+f(p.cutH)+' cm)':'')}];
  function stripArea(a,b,bs){function seg(a,b){return ((y(a)-bs)+(y(b)-bs))/2*(b-a);}return a<0&&b>0?seg(a,0)+seg(0,b):seg(a,b);}
  walls.forEach(function(w,wi){
    var an=XO+p['o'+(6+wi)];w.anchor=an;
    w.strips=strips(w.x0,w.x1,an).map(function(s){return {id:++id,a:s[0],b:s[1]};});
    var cand=[w.x0,w.x1];w.strips.forEach(function(s){cand.push(s.a,s.b);});
    w.xr=cand.reduce(function(b,c){return Math.abs(c-an)<Math.abs(b-an)?c:b;},cand[0]);
    w.ref='R'+(refs.length+1);
    w.strips.forEach(function(s){area+=stripArea(s.a,s.b,w.bs);});fields+=w.strips.length;
    refs.push({id:w.ref,name:'Ściana szczytowa '+w.title,fields:w.strips[0].id+'–'+w.strips[w.strips.length-1].id,where:'dół paska na linii łączenia x='+f(w.xr),coord:'x='+f(w.xr)+', wys.='+f(w.bs)+', ściana z='+f(w.z)});
  });
  var win=null;
  if(p.winOn){var wx=-hw+p.winD;if(wx<-1){win=[[wx,p.winD],[0,p.winD],[0,RID-p.winD/C],[wx,y(wx)-p.winD/C]];
    var s2=0;for(var i=0;i<4;i++){var a=win[i],b=win[(i+1)%4];s2+=a[0]*b[1]-b[0]*a[1];}area-=Math.abs(s2)/2;}}
  var plate=p.PL*p.PW;
  return {p:p,warn:n.w,A:A,C:C,hw:hw,XR:XR,XA:XA,XB:XB,ZB:ZB,ZA:ZA,L:L,RID:RID,HR:HR,HL:p.HL,y:y,surfs:surfs,walls:walls,refs:refs,win:win,areaCm2:area,areaM2:area/1e4,fields:fields,plate:plate,ZO:ZO,XO:XO,
    minPlates:Math.ceil(area/plate),plates80:Math.ceil(area/plate/0.8)};
}

// ---------- rysunki ----------
function refMark(x,y_,label,dx,dy,anchor){return '<circle cx="'+x.toFixed(1)+'" cy="'+y_.toFixed(1)+'" r="5" class="ref"/>'+T(x+(dx||8),y_+(dy||-7),label,'rl',anchor||'start');}
function drawBoard(s,ox,oy){
  var X=function(v){return ox+v*SC;},Yz=function(z){return oy+(z-s.z0)*SC;},g='',u=s.u;
  var poly=s.notch?[[0,s.z0],[u,s.z0],[u,s.z1],[s.notch[1],s.z1],[s.notch[1],s.notch[0]],[0,s.notch[0]]]:[[0,s.z0],[u,s.z0],[u,s.z1],[0,s.z1]];
  g+='<polygon points="'+pts(poly.map(function(q){return [X(q[0]),Yz(q[1])];}))+'" class="sl"/>';
  s.cols.slice(1).forEach(function(c){var x0=s.notch&&c.a>s.notch[0]?s.notch[1]:0;g+='<line x1="'+X(x0).toFixed(1)+'" y1="'+Yz(c.a).toFixed(1)+'" x2="'+X(u).toFixed(1)+'" y2="'+Yz(c.a).toFixed(1)+'" class="'+(Math.abs(c.a-s.anchor)<.5?'js':'j')+'"/>';});
  if(s.cut)g+='<line x1="'+X(s.cut).toFixed(1)+'" y1="'+Yz(s.z0).toFixed(1)+'" x2="'+X(s.cut).toFixed(1)+'" y2="'+Yz(s.z1).toFixed(1)+'" class="cut"/>';
  s.cols.forEach(function(c){
    var st=s.notch&&c.a>=s.notch[0]?s.notch[1]:0,en=s.cut||u,cx=X((st+en)/2),big=c.b-c.a>=20;
    g+=T(cx,Yz((c.a+c.b)/2)+(big?5:3),c.id,big?'n':'n s')+T(X(u)+4,Yz((c.a+c.b)/2)+3,f(c.b-c.a),'t3','start');
  });
  if(s.cut){g+=T(X(s.cut/2),Yz(s.z1)+12,'dach '+f(s.cut))+T(X((s.cut+u)/2),Yz(s.z1)+12,'ściana '+f(u-s.cut));}
  else g+=T(X(u/2),Yz(s.z1)+12,'wys. '+f(u));
  g+=T(X(0),Yz(s.z0)-6,s.title,'t','start');
  g+=refMark(X(s.ur),Yz(s.zr),s.ref,8,-7);
  return {g:g,w:X(u)+34,h:Yz(s.z1)+20};
}
function svgBoards(m){
  var out='',colx=M+m.surfs[0].u*SC+110,oy=M+18,maxw=0,maxh=0;
  var r=drawBoard(m.surfs[0],M,oy);out+=r.g;maxw=r.w;maxh=r.h;
  var y_=oy,right=0;
  m.surfs.slice(1).forEach(function(s){var d=drawBoard(s,colx,y_);out+=d.g;right=Math.max(right,d.w);y_=d.h+34;});
  return {svg:out,w:Math.max(right,colx+10)+M,h:Math.max(maxh,y_)+M};
}
function wallDraw(m,w,ox,oy){
  var X=function(x){return ox+(x-w.x0)*SC;},Y=function(h){return oy+(m.RID-h)*SC;},g='',base=Y(w.bs);
  w.strips.forEach(function(s){
    var top=[[s.a,m.y(s.a)]];if(s.a<0&&s.b>0)top.push([0,m.RID]);top.push([s.b,m.y(s.b)]);
    var poly=[[X(s.a),base]].concat(top.map(function(q){return [X(q[0]),Y(q[1])];})).concat([[X(s.b),base]]);
    g+='<polygon points="'+pts(poly)+'" class="sl"/>';
    var hmax=Math.max.apply(null,top.map(function(q){return q[1];})),big=s.b-s.a>=20;
    g+=T(X((s.a+s.b)/2),Y((hmax+w.bs)/2)+5,s.id,big?'n':'n s')+T(X((s.a+s.b)/2),base+12,f(s.b-s.a))+T(X(s.a)+2,Y(m.y(s.a))-3,f(m.y(s.a)),'t3','start');
  });
  if(w.z===0&&m.win){g+='<polygon points="'+pts(m.win.map(function(q){return [X(q[0]),Y(q[1])];}))+'" class="win"/>'+T(X(m.win[0][0]/2),Y(m.win[0][1]+60),'okno','t3');}
  if(w.bs>0){g+='<polygon points="'+pts([[X(w.x0),Y(0)],[X(w.x1),Y(0)],[X(w.x1),Y(w.bs)],[X(w.x0),Y(w.bs)]])+'" class="hole"/>'+T(X((w.x0+w.x1)/2),Y(w.bs/2)+3,'wycięcie '+f(w.bs)+' cm','t3');}
  g+=T(X(w.x0),Y(m.RID)-16,w.title,'t','start');
  g+=refMark(X(w.xr),base,w.ref,6,-8);
  return {g:g,w:(w.x1-w.x0)*SC,h:m.RID*SC};
}
function svgGables(m){
  var ws=m.walls,rowH=m.RID*SC+60,oy1=M+26,oy2=oy1+rowH,out='',gap=50;
  var d0=wallDraw(m,ws[0],M,oy1),d1=wallDraw(m,ws[1],M+d0.w+gap,oy1);
  var d2=wallDraw(m,ws[2],M,oy2),d3=wallDraw(m,ws[3],M+d2.w+gap,oy2);
  out=d0.g+d1.g+d2.g+d3.g;
  var W_=Math.max(M+d0.w+gap+d1.w,M+d2.w+gap+d3.w)+M;
  return {svg:out,w:W_,h:oy2+m.RID*SC+40};
}
function svgPlan(m){
  var X=function(x){return M+(x+m.hw)*SC;},Z=function(z){return M+18+z*SC;},g='';
  var poly=[[-m.hw,0],[m.XA,0],[m.XA,m.ZA],[m.XR,m.ZA],[m.XR,m.L],[m.XB,m.L],[m.XB,m.ZB],[-m.hw,m.ZB]];
  g+='<polygon points="'+pts(poly.map(function(q){return [X(q[0]),Z(q[1])];}))+'" class="sl"/>';
  m.surfs.forEach(function(s,si){if(si>3)return;var xa=[-m.hw,0,0,0][si],xb=[0,m.XA,m.XR,m.XR][si];
    s.cols.slice(1).forEach(function(c){var x0=si===3&&c.a>m.ZB?m.XB:xa;g+='<line x1="'+X(x0).toFixed(1)+'" y1="'+Z(c.a).toFixed(1)+'" x2="'+X(xb).toFixed(1)+'" y2="'+Z(c.a).toFixed(1)+'" class="'+(Math.abs(c.a-s.anchor)<.5?'js':'j')+'"/>';});});
  g+='<line x1="'+X(0).toFixed(1)+'" y1="'+Z(0).toFixed(1)+'" x2="'+X(0).toFixed(1)+'" y2="'+Z(m.ZB).toFixed(1)+'" class="rd"/>'+T(X(0)+4,Z(18),'kalenica','t3','start');

function cutPieces(m){

  });

// ---------- propozycja cięć ----------
function cutPieces(m){
  var out=[],y=m.y,PL=m.p.PL,PW=m.p.PW;
  m.surfs.forEach(function(s){
    s.cols.forEach(function(c){
      var parts=[];
      if(s.notch){
        var wA=Math.min(c.b,s.notch[0])-c.a,wB=c.b-Math.max(c.a,s.notch[0]);
        if(wA>0.5)parts.push({w:wA,l:s.u,cut:s.cut});
        if(wB>0.5)parts.push({w:wB,l:s.u-s.notch[1],cut:s.cut?s.cut-s.notch[1]:null});
      }else parts.push({w:c.b-c.a,l:s.u,cut:s.cut});
      parts.forEach(function(pt){
        var l=pt.l;
        while(l>PL+1e-6){out.push({kind:'rect',l:PL,w:pt.w,ids:[c.id],cut:null});l-=PL;}
        out.push({kind:'rect',l:l,w:pt.w,ids:[c.id],cut:l===pt.l?pt.cut:null});
      });
    });
  });
  m.walls.forEach(function(w){
    var bs=w.bs,st=w.strips,i=0;
    while(i<st.length){
      var s=st[i],n=st[i+1],paired=false,crosses=function(q){return m.bp.some(function(b){return b>q.a+1e-6&&b<q.b-1e-6;});};
      if(n&&!crosses(s)&&!crosses(n)&&Math.abs((s.b-s.a)-(n.b-n.a))<0.5){
        var ya=y(s.a)-bs,yb=y(s.b)-bs,yc=y(n.b)-bs,tot=ya+yc;
        if(tot<=PL&&Math.abs(yb-(ya+yc)/2)<0.5){out.push({kind:'pair',l:tot,w:s.b-s.a,ids:[s.id,n.id],ya:ya,yb:yb,yc:yc});i+=2;paired=true;}
      }
      if(!paired){
        var prof=m.profile(s.a,s.b).map(function(q){return [(q[0]-s.a)/(s.b-s.a),q[1]-bs];}),ha=prof[0][1],hb=prof[prof.length-1][1];
        out.push({kind:'trap',l:Math.max.apply(null,prof.map(function(q){return q[1];})),w:s.b-s.a,ids:[s.id],ha:ha,hb:hb,prof:prof});i++;
      }
    }
  });
  return out;
}
function packCuts(pcs,PL,PW){
  var plates=[];
  pcs.slice().sort(function(a,b){return b.w-a.w||b.l-a.l;}).forEach(function(pc){
    var placed=false,pl,sh,k,j;
    for(k=0;k<plates.length&&!placed;k++){pl=plates[k];for(j=0;j<pl.shelves.length;j++){sh=pl.shelves[j];if(sh.h>=pc.w-1e-6&&PL-sh.used>=pc.l-1e-6){pl.items.push({p:pc,x:sh.used,y:sh.y});sh.used+=pc.l;placed=true;break;}}}
    for(k=0;k<plates.length&&!placed;k++){pl=plates[k];if(PW-pl.usedW>=pc.w-1e-6){sh={y:pl.usedW,h:pc.w,used:pc.l};pl.shelves.push(sh);pl.usedW+=pc.w;pl.items.push({p:pc,x:0,y:sh.y});placed=true;}}
    if(!placed){pl={shelves:[],items:[],usedW:pc.w};pl.shelves.push({y:0,h:pc.w,used:pc.l});pl.items.push({p:pc,x:0,y:0});plates.push(pl);}
  });
  plates.forEach(function(pl){var a=0;pl.items.forEach(function(it){var p=it.p;a+=p.kind==='pair'?p.l*p.w:(p.kind==='trap'?trapArea(p):p.l*p.w);});pl.area=a;pl.use=a/(PL*PW);});

function trapArea(p){var t=0;for(var i=0;i<p.prof.length-1;i++)t+=p.w*(p.prof[i+1][0]-p.prof[i][0])*(p.prof[i][1]+p.prof[i+1][1])/2;return t;}
function plateInner(pl,idx,m){
  var PL=m.p.PL,PW=m.p.PW,g='<rect x="0" y="0" width="'+PL+'" height="'+PW+'" class="bd"/>',ids=[];
  pl.items.forEach(function(it){
    var p=it.p,x=it.x,y_=it.y,w=p.w,lab=p.ids.join('+');p.ids.forEach(function(i){ids.push(i);});
    if(p.kind==='rect'){

      if(p.cut)g+='<line x1="'+(x+p.cut).toFixed(1)+'" y1="'+y_.toFixed(1)+'" x2="'+(x+p.cut).toFixed(1)+'" y2="'+(y_+w).toFixed(1)+'" class="cut"/>';

    }else if(p.kind==='pair'){
      g+='<polygon points="'+pts([[x,y_],[x+p.ya,y_],[x+p.yb,y_+w],[x,y_+w]])+'" class="sl"/><polygon points="'+pts([[x+p.ya,y_],[x+p.l,y_],[x+p.l,y_+w],[x+p.yb,y_+w]])+'" class="sl"/>';
      g+=T(x+Math.min(p.ya,p.yb)/2,y_+w/2+5,p.ids[0],w>=14?'n':'n s')+T(x+p.l-Math.min(p.yb,p.yc)/2,y_+w/2+5,p.ids[1],w>=14?'n':'n s');
      g+=T(x+p.l/2,y_+w-3,f(p.ya)+'→'+f(p.yb)+' / '+f(p.yc)+'→'+f(p.yb)+' ('+f(w)+')','t3');
    }else{
      var poly=[[x,y_]].concat(p.prof.map(function(q){return [x+q[1],y_+w*q[0]];})).concat([[x,y_+w]]);
      g+='<polygon points="'+pts(poly)+'" class="sl"/>'+T(x+Math.min(p.ha,p.hb)/2,y_+w/2+(w>=14?5:3),lab,w>=14?'n':'n s')+T(x+p.l-2,y_+w-3,f(p.ha)+'→'+f(p.hb)+' ('+f(w)+')','t3','end');
    }

  return {g:g,title:'Płyta '+(idx+1)+': pola '+ids.sort(function(a,b){return a-b;}).join(', ')+' · wykorzystanie '+Math.round(pl.use*100)+'%'};
}
function cutPlan(m){var pc=cutPieces(m),pl=packCuts(pc,m.p.PL,m.p.PW);return pl;}

function textPage(m,foot){

  $('sheets').innerHTML='<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(440px,1fr));gap:12px 18px">'+sheets(m).join('')+'</div>';

var EXP='.bd{fill:#f1f1f1;stroke:#222;stroke-width:1}svg text{fill:#1c2630;font-family:Arial,Helvetica,sans-serif}.sl{stroke:#222;stroke-width:1.4}.r0{fill:#e3c196}.r1{fill:#b8d3a8}.r2{fill:#a9c7e4}.r3{fill:#e4b3c8}.rb{fill:#f3e19a;stroke-dasharray:5 3}.cut{stroke:#c8372d;stroke-width:1.2;stroke-dasharray:4 2}.t{font-size:12px;font-weight:700}.t2{font-size:11px}.t3{font-size:9px}.n{font-size:15px;font-weight:700}.n.s{font-size:9px}.h{font-size:20px;font-weight:700}.sm{font-size:12px;fill:#444}';
function pageSvg(title,body,w,h,foot){var pad=24,W=w+pad*2,H=h+pad*2+36;return {w:W,h:H,svg:'<svg xmlns="http://www.w3.org/2000/svg" width="'+f(W)+'" height="'+f(H)+'" viewBox="0 0 '+f(W)+' '+f(H)+'"><style>'+EXP+'</style><rect width="100%" height="100%" fill="#fff"/><text x="'+pad+'" y="30" class="h">'+title+'</text><g transform="translate('+pad+',36)">'+body+'</g><text x="'+pad+'" y="'+f(H-8)+'" class="sm">'+foot+'</text></svg>'};}
function toPng(page){return new Promise(function(res,rej){var img=new Image(),url=URL.createObjectURL(new Blob([page.svg],{type:'image/svg+xml'})),k=Math.min(3,3600/page.w);
  img.onload=function(){var c=document.createElement('canvas');c.width=Math.round(page.w*k);c.height=Math.round(page.h*k);var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);res({data:c.toDataURL('image/png'),w:page.w,h:page.h});};
  img.onerror=function(){URL.revokeObjectURL(url);rej(new Error('Nie udało się narysować strony PDF.'));};img.src=url;});}
async function buildPdf(m){
  var J=window.jspdf&&window.jspdf.jsPDF;if(!J)throw new Error('Biblioteka PDF się nie wczytała.');
  var foot='Wymiary w cm. Sporządzono '+new Date().toLocaleDateString('pl-PL')+'. Propozycja, nie zastępuje pomiaru na budowie.';
  var y=30,g='',sep=m.per.reduce(function(a,p){return a+p.alone;},0)+m.bandAlone;
  g+='<text x="0" y="'+y+'" class="t">Płyt razem: '+m.plates.length+' ('+(m.plates.length*m.PL*m.PW/1e4).toFixed(1)+' m² brutto), w tym '+m.extraPlates+' dokupionych na opaskę. Osobno: '+sep+' płyt.</text>';y+=24;
  m.per.forEach(function(p){g+='<text x="0" y="'+y+'" class="sm">'+p.r.name+': '+p.n+' kawałków, '+(p.area/1e4).toFixed(1)+' m² netto, osobno '+p.alone+' płyt</text>';y+=20;});
  g+='<text x="0" y="'+y+'" class="sm">Opaska '+f(m.bandLen)+' × '+f(m.bandH)+' cm: '+Math.round(m.fromOff)+' cm ze ścinek, reszta z dokupionych płyt, kawałków '+m.segs.length+' (każdy '+f(m.bandH)+' × maks. '+f(m.PW)+' cm, słoje pionowo)</text>';y+=24;
  g+='<text x="0" y="'+y+'" class="sm">Kolory: S salon, Sy sypialnia, Ł1 i Ł2 łazienki, żółta ramka opaska.</text>';
  var pg=[pageSvg('Wspólny rozkrój płyt: podsumowanie',g,1000,y,foot)];
  var per=6,cw=m.PL+36,rh=m.PW+58,np=Math.ceil(m.plates.length/per);
  for(var pi=0;pi<np;pi++){var gg='',n=Math.min(per,m.plates.length-pi*per);for(var k=0;k<n;k++){var r=plateSvg(m.plates[pi*per+k],pi*per+k,m),cx=(k%2)*cw,cy=Math.floor(k/2)*rh;gg+='<g transform="translate('+cx+','+(cy+18)+')">'+T(0,-6,r.title,'t','start')+r.g+'</g>';}
    pg.push(pageSvg('Wspólny rozkrój płyt ('+(pi+1)+'/'+np+')',gg,cw*2,Math.ceil(n/2)*rh+10,foot));}
  var doc=new J({orientation:'landscape',unit:'mm',format:'a4'});
  for(var i=0;i<pg.length;i++){var im=await toPng(pg[i]);if(i)doc.addPage();var mw=285,mh=198,s=Math.min(mw/im.w,mh/im.h),w=im.w*s,h=im.h*s;doc.addImage(im.data,'PNG',(297-w)/2,(210-h)/2,w,h);}
  return doc.output('blob');
}
